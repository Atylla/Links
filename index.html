<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1118">
  <meta name="description" content="Todos os meus links em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Minha central de links">
  <meta property="og:description" content="Todos os meus links em um só lugar.">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Minha central de links</title>
  <script src="./data/site.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="page-shell">
    <div class="topline">
      <span class="eyebrow"><span class="pulse" aria-hidden="true"></span> UM LUGAR, MUITOS CAMINHOS</span>
      <button class="share-button" id="shareButton" type="button" aria-label="Compartilhar esta página" title="Compartilhar esta página">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        <span>Compartilhar</span>
      </button>
    </div>

    <header class="profile" id="profile">
      <div class="avatar-wrap"><div class="avatar" id="avatar" aria-hidden="true">✦</div><span class="avatar-mark" aria-hidden="true">✦</span></div>
      <div class="handle" id="profileHandle">@seuperfil</div>
      <h1 id="profileName">Sua central de links</h1>
      <p id="profileBio">Tudo o que você precisa encontrar, reunido aqui.</p>
    </header>

    <section class="content" aria-labelledby="linksHeading">
      <div class="section-intro">
        <div><span class="section-kicker">EXPLORE</span><h2 id="linksHeading">Encontre seu caminho<span class="accent-dot">.</span></h2></div>
        <span class="count-pill" id="linksCount" aria-live="polite">0 links</span>
      </div>
      <div class="search-holder" id="searchHolder" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <label class="sr-only" for="searchInput">Buscar links</label>
        <input id="searchInput" type="search" placeholder="Buscar um link..." autocomplete="off">
      </div>
      <div id="linksContainer" class="links-container" aria-live="polite"></div>
    </section>

    <footer class="footer"><span class="footer-star" aria-hidden="true">✳</span><span id="footerText">Todos os links em um só lugar.</span></footer>
  </main>
  <div role="status" id="toast" class="toast" aria-live="polite"></div>
  <noscript><p class="no-script">Este site precisa do JavaScript habilitado para exibir os links.</p></noscript>
</body>
</html>
